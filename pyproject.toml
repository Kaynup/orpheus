[project]
name = "orpheus-rag"
version = "0.2.3"
description = "Retrieval-Augmented Generation (RAG) system with persistent vector storage and verifiable source citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
# Set the maximum line length to 120
line-length = 120

# Assume Python 3.10
target-version = "py310"

# Exclude common directories
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "data",
    "env",
    "venv",
    ".venv",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`, `W`), and isort (`I`)
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
# Ensure imports are sorted and grouped properly
known-first-party = ["app"]
